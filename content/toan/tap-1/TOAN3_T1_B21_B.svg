<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-labelledby="title desc"><title id="title">Hình B: Khối hộp chữ nhật</title><desc id="desc">Mô hình có tám đỉnh A, B, C, D, E, F, G, H. Cạnh khuất vẽ nét đứt; cần tính đủ phần phía sau.</desc><rect width="560" height="320" rx="18" fill="#f4f7ff"/><g font-family="sans-serif" font-size="22" fill="#17345e"><text x="20" y="30">Hình B: Khối hộp chữ nhật</text><path d="M80 125L290 125" fill="none" stroke="#28609b" stroke-width="3"/><path d="M290 125L290 225" fill="none" stroke="#28609b" stroke-width="3"/><path d="M290 225L80 225" fill="none" stroke="#28609b" stroke-width="3"/><path d="M80 225L80 125" fill="none" stroke="#28609b" stroke-width="3"/><path d="M140 65L350 65" fill="none" stroke="#28609b" stroke-width="3"/><path d="M350 65L350 165" fill="none" stroke="#28609b" stroke-width="3"/><path d="M350 165L140 165" fill="none" stroke="#28609b" stroke-width="3" stroke-dasharray="7 5"/><path d="M140 165L140 65" fill="none" stroke="#28609b" stroke-width="3" stroke-dasharray="7 5"/><path d="M80 125L140 65" fill="none" stroke="#28609b" stroke-width="3"/><path d="M290 125L350 65" fill="none" stroke="#28609b" stroke-width="3"/><path d="M290 225L350 165" fill="none" stroke="#28609b" stroke-width="3"/><path d="M80 225L140 165" fill="none" stroke="#28609b" stroke-width="3" stroke-dasharray="7 5"/><circle cx="80" cy="125" r="4"/><text x="72" y="113">A</text><circle cx="290" cy="125" r="4"/><text x="282" y="113">B</text><circle cx="290" cy="225" r="4"/><text x="298" y="248">C</text><circle cx="80" cy="225" r="4"/><text x="60" y="230">D</text><circle cx="140" cy="65" r="4"/><text x="132" y="53">E</text><circle cx="350" cy="65" r="4"/><text x="342" y="53">F</text><circle cx="350" cy="165" r="4"/><text x="358" y="188">G</text><circle cx="140" cy="165" r="4"/><text x="120" y="170">H</text><text x="35" y="298" font-size="17">Nét đứt: cạnh khuất. Hình biểu diễn không dùng để đo.</text></g></svg>
