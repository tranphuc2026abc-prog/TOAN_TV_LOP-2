<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-labelledby="title desc"><title id="title">Hình A: Ba góc ở các đỉnh O, P, E</title><desc id="desc">Góc I có cạnh OA thẳng đứng và OB nằm ngang. Góc II có PM chếch lên và PN nằm ngang. Góc III có EC chếch lên trái và ED nằm ngang.</desc><rect width="600" height="280" rx="18" fill="#f4f7ff"/><g font-family="sans-serif" font-size="22" fill="#17345e"><text x="20" y="30">Hình A</text><text x="85" y="245">I</text><path d="M65 75L65 175L165 175" stroke="#17345e" stroke-width="3" fill="none"/><circle cx="65" cy="175" r="4"/><text x="57" y="204">O</text><circle cx="65" cy="75" r="4"/><text x="57" y="63">A</text><circle cx="165" cy="175" r="4"/><text x="157" y="204">B</text><text x="270" y="245">II</text><path d="M300 75L250 175L350 175" stroke="#17345e" stroke-width="3" fill="none"/><circle cx="250" cy="175" r="4"/><text x="242" y="204">P</text><circle cx="300" cy="75" r="4"/><text x="292" y="63">M</text><circle cx="350" cy="175" r="4"/><text x="342" y="204">N</text><text x="465" y="245">III</text><path d="M375 105L445 175L555 175" stroke="#17345e" stroke-width="3" fill="none"/><circle cx="445" cy="175" r="4"/><text x="437" y="204">E</text><circle cx="375" cy="105" r="4"/><text x="367" y="93">C</text><circle cx="555" cy="175" r="4"/><text x="547" y="204">D</text></g></svg>
