<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" role="img" aria-labelledby="title desc"><title id="title">Hình A: Số thẻ Lan gấp ba lần Bình</title><desc id="desc">Bình có một phần gồm năm thẻ. Lan có ba phần bằng nhau, mỗi phần bằng số thẻ Bình.</desc><rect width="560" height="290" rx="18" fill="#f4f7ff"/><g font-family="sans-serif" font-size="22" fill="#17345e"><text x="20" y="30">Hình A: Sơ đồ số thẻ</text><text x="20" y="110">Bình</text><text x="20" y="200">Lan</text><rect x="120" y="80" width="100" height="45" fill="#d9eaff" stroke="#17345e" stroke-width="2"/><rect x="120" y="170" width="100" height="45" fill="#d6f0e6" stroke="#17345e" stroke-width="2"/><circle cx="130" cy="192" r="4"/><circle cx="146" cy="192" r="4"/><circle cx="162" cy="192" r="4"/><circle cx="178" cy="192" r="4"/><circle cx="194" cy="192" r="4"/><rect x="220" y="170" width="100" height="45" fill="#ecf9f3" stroke="#17345e" stroke-width="2"/><circle cx="230" cy="192" r="4"/><circle cx="246" cy="192" r="4"/><circle cx="262" cy="192" r="4"/><circle cx="278" cy="192" r="4"/><circle cx="294" cy="192" r="4"/><rect x="320" y="170" width="100" height="45" fill="#d6f0e6" stroke="#17345e" stroke-width="2"/><circle cx="330" cy="192" r="4"/><circle cx="346" cy="192" r="4"/><circle cx="362" cy="192" r="4"/><circle cx="378" cy="192" r="4"/><circle cx="394" cy="192" r="4"/><circle cx="130" cy="102" r="4"/><circle cx="146" cy="102" r="4"/><circle cx="162" cy="102" r="4"/><circle cx="178" cy="102" r="4"/><circle cx="194" cy="102" r="4"/><text x="140" y="150" font-size="18">1 phần: 5 thẻ</text><text x="145" y="250" font-size="19">3 phần bằng nhau, mỗi phần 5 thẻ</text></g></svg>
