<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-labelledby="title desc"><title id="title">Hình A: Khối lập phương</title><desc id="desc">Mô hình có tám đỉnh A, B, C, D, E, F, G, H. Cạnh khuất vẽ nét đứt; cần tính đủ phần phía sau.</desc><rect width="560" height="320" rx="18" fill="#f4f7ff"/><g font-family="sans-serif" font-size="22" fill="#17345e"><text x="20" y="30">Hình A: Khối lập phương</text><path d="M100 115L220 115" fill="none" stroke="#28609b" stroke-width="3"/><path d="M220 115L220 235" fill="none" stroke="#28609b" stroke-width="3"/><path d="M220 235L100 235" fill="none" stroke="#28609b" stroke-width="3"/><path d="M100 235L100 115" fill="none" stroke="#28609b" stroke-width="3"/><path d="M160 65L280 65" fill="none" stroke="#28609b" stroke-width="3"/><path d="M280 65L280 185" fill="none" stroke="#28609b" stroke-width="3"/><path d="M280 185L160 185" fill="none" stroke="#28609b" stroke-width="3" stroke-dasharray="7 5"/><path d="M160 185L160 65" fill="none" stroke="#28609b" stroke-width="3" stroke-dasharray="7 5"/><path d="M100 115L160 65" fill="none" stroke="#28609b" stroke-width="3"/><path d="M220 115L280 65" fill="none" stroke="#28609b" stroke-width="3"/><path d="M220 235L280 185" fill="none" stroke="#28609b" stroke-width="3"/><path d="M100 235L160 185" fill="none" stroke="#28609b" stroke-width="3" stroke-dasharray="7 5"/><circle cx="100" cy="115" r="4"/><text x="92" y="103">A</text><circle cx="220" cy="115" r="4"/><text x="212" y="103">B</text><circle cx="220" cy="235" r="4"/><text x="228" y="258">C</text><circle cx="100" cy="235" r="4"/><text x="80" y="240">D</text><circle cx="160" cy="65" r="4"/><text x="152" y="53">E</text><circle cx="280" cy="65" r="4"/><text x="272" y="53">F</text><circle cx="280" cy="185" r="4"/><text x="288" y="208">G</text><circle cx="160" cy="185" r="4"/><text x="140" y="190">H</text><text x="35" y="298" font-size="17">Nét đứt: cạnh khuất. Hình biểu diễn không dùng để đo.</text></g></svg>
