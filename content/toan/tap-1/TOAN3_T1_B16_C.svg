<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" role="img" aria-labelledby="title desc">
<title id="title">Hình C — Trung điểm M</title><desc id="desc">A, M, B thẳng hàng theo thứ tự đó. AM dài 4 cm, MB dài 4 cm.</desc>
<rect width="560" height="230" rx="18" fill="#f3f7ff"/>
<g font-family="sans-serif" fill="#17345e"><text x="20" y="30" font-size="22">Hình C: A, M, B thẳng hàng</text>
<path d="M80 115H480" stroke="#17345e" stroke-width="3"/>
<text x="160" y="92" font-size="22">4 cm</text><text x="360" y="92" font-size="22">4 cm</text><circle cx="80" cy="115" r="6"/><text x="71" y="150" font-size="24">A</text><circle cx="280" cy="115" r="6"/><text x="271" y="150" font-size="24">M</text><circle cx="480" cy="115" r="6"/><text x="471" y="150" font-size="24">B</text><text x="85" y="205" font-size="18">AM = MB = 4 cm; M nằm giữa A và B.</text></g></svg>
