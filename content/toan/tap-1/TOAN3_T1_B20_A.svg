<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-labelledby="title desc"><title id="title">Hình A: Vẽ chữ nhật và hình vuông trên lưới</title><desc id="desc">Bên trái hình chữ nhật dài bốn khoảng ô, rộng hai khoảng ô. Bên phải hình vuông có cạnh ba khoảng ô. Một ô màn hình không được xem là một cm thật.</desc><rect width="560" height="320" rx="18" fill="#f4f7ff"/><g font-family="sans-serif" font-size="22" fill="#17345e"><text x="20" y="30">Hình A — Mỗi khoảng lưới là một ô</text><path d="M40 55V255M40 55H240" stroke="#bccde1" stroke-width="1"/><path d="M80 55V255M40 95H240" stroke="#bccde1" stroke-width="1"/><path d="M120 55V255M40 135H240" stroke="#bccde1" stroke-width="1"/><path d="M160 55V255M40 175H240" stroke="#bccde1" stroke-width="1"/><path d="M200 55V255M40 215H240" stroke="#bccde1" stroke-width="1"/><path d="M240 55V255M40 255H240" stroke="#bccde1" stroke-width="1"/><path d="M320 55V255M320 55H520" stroke="#bccde1" stroke-width="1"/><path d="M360 55V255M320 95H520" stroke="#bccde1" stroke-width="1"/><path d="M400 55V255M320 135H520" stroke="#bccde1" stroke-width="1"/><path d="M440 55V255M320 175H520" stroke="#bccde1" stroke-width="1"/><path d="M480 55V255M320 215H520" stroke="#bccde1" stroke-width="1"/><path d="M520 55V255M320 255H520" stroke="#bccde1" stroke-width="1"/><path d="M40 95H200V175H40ZM360 95H480V215H360Z" fill="none" stroke="#17345e" stroke-width="3"/><text x="20" y="290" font-size="19">Chữ nhật: dài 4 ô, rộng 2 ô</text><text x="315" y="290" font-size="19">Hình vuông: cạnh 3 ô</text></g></svg>
