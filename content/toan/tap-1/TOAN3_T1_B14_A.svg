<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" role="img" aria-labelledby="title desc">
<title id="title">Hình A — Một phần tư</title><desc id="desc">Một hình chữ nhật chia thành bốn dải có cùng chiều rộng, tô xanh dải thứ nhất.</desc>
<rect width="560" height="230" rx="18" fill="#f3f7ff"/>
<g font-family="sans-serif" fill="#17345e"><text x="20" y="30" font-size="22">Hình A: bốn dải bằng nhau</text><rect x="80" y="65" width="100" height="100" fill="#42a5e6" stroke="#17345e" stroke-width="2"/><rect x="180" y="65" width="100" height="100" fill="white" stroke="#17345e" stroke-width="2"/><rect x="280" y="65" width="100" height="100" fill="white" stroke="#17345e" stroke-width="2"/><rect x="380" y="65" width="100" height="100" fill="white" stroke="#17345e" stroke-width="2"/><text x="90" y="205" font-size="18">Tô một dải trong bốn dải bằng nhau.</text></g></svg>
