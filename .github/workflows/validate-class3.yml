name: Validate class 3 learning site

on:
  push:
    branches: [build-lop-3]
  pull_request:
    branches: [build-lop-3]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check embedded JavaScript syntax
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=h.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw new Error('No embedded script found');fs.writeFileSync('/tmp/site.js',m[1]);"
          node --check /tmp/site.js
      - name: Check essential app features and lesson count
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const count=(h.match(/^\\[\"(?:TOAN3|TV3|TA3)_/gm)||[]).length;if(count!==17)throw new Error('Expected 17 trial lesson entries, found '+count);for(const s of ['function exportProgress()','function importProgress(input)','CURRICULUM_COMPLETE'])if(!h.includes(s))throw new Error('Missing expected feature: '+s);console.log('OK: '+count+' lesson entries; backup/restore functions present; full-course badges guarded.');"
