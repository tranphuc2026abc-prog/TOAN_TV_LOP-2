name: Extract textbook PDF text for curriculum processing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-pdf-index.yml"
      - "scripts/extract_pdf_index.py"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF parser
        run: pip install pymupdf
      - name: Extract searchable text from six source books
        run: python scripts/extract_pdf_index.py
      - name: Upload temporary extraction artifact
        uses: actions/upload-artifact@v4
        with:
          name: class3-pdf-text-extraction
          path: extraction-output/
          if-no-files-found: error
          retention-days: 2
