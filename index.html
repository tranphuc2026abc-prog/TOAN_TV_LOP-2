function say(t){
 try{
  if(!("speechSynthesis" in window)||!("SpeechSynthesisUtterance" in window)){toast("Trình duyệt này chưa hỗ trợ phát âm. Hãy mở website bằng Chrome.");return}
  var text=String(t).replace(/[→/]/g," ").trim();
  var synth=window.speechSynthesis;
  synth.cancel();
  var speakNow=function(){
   var u=new SpeechSynthesisUtterance(text);
   var isVi=/[ăâêôơưđ]/i.test(text);
   u.lang=isVi?"vi-VN":"en-US";
   var voices=synth.getVoices?synth.getVoices():[];
   var voice=voices.filter(function(v){return isVi?/^vi(-|$)/i.test(v.lang):/^en-US$/i.test(v.lang)})[0];
   if(!voice&&!isVi)voice=voices.filter(function(v){return /^en(-|$)/i.test(v.lang)})[0];
   if(voice)u.voice=voice;
   u.rate=0.85;
   u.onerror=function(){toast("Chưa phát được âm thanh. Kiểm tra âm lượng và giọng đọc trên điện thoại.")};
   synth.speak(u);
  };
  var voices=synth.getVoices?synth.getVoices():[];
  if(!voices.length){
   var retried=false;
   var retry=function(){if(retried)return;retried=true;synth.onvoiceschanged=null;speakNow()};
   synth.onvoiceschanged=retry;
   setTimeout(function(){if(!retried){retried=true;synth.onvoiceschanged=null;speakNow()}},400);
  }else speakNow();
 }catch(e){toast("Không thể phát âm trên trình duyệt này. Hãy thử mở bằng Chrome.");}
}

function startMini(mode){
 var all=gameShuffle(gameQuestions());
 if(!all.length){toast("Chưa có câu hỏi để chơi.");return;}
 G={mode:mode,all:all,idx:0,score:0,answered:0,seconds:60,timerId:null,ended:false,feedback:"",selected:-1};
 if(mode==="match"){
  G.pairs=all.slice(0,Math.min(5,all.length)).map(function(q,i){return {i:i,prompt:q.prompt,answer:String(q.answer),done:false};});
  G.qSide=gameShuffle(G.pairs.map(function(x){return x.i;}));
  G.aSide=gameShuffle(G.pairs.map(function(x){return x.i;}));
  G.pickQ=null;G.pickA=null;G.tries=0;
 }else if(mode==="speed"){
  G.all=all;G.started=Date.now();
  G.timerId=setInterval(function(){if(!G||G.mode!=="speed"||G.ended)return;G.seconds=Math.max(0,60-Math.floor((Date.now()-G.started)/1000));var el=document.getElementById("gameClock");if(el)el.textContent=G.seconds;if(G.seconds<=0)finishMini();},500);
 }else if(mode==="tf"){
  prepareTF();
 }else{
  G.all=all.slice(0,10);
  G.chest=gameShuffle(["🎁 Rương cầu vồng","💎 Rương kim cương","⭐ Rương ngôi sao"]);
 }
 go({p:"minigame"});
}
function prepareTF(){
 var q=G.all[G.idx%G.all.length],opts=gameOptions(q),isTrue=Math.random()<0.5;
 var shown=isTrue?String(q.answer):opts.filter(function(x){return x!==String(q.answer);})[0];
 if(shown===undefined)shown=String(q.answer);
 G.current=q;G.statement=shown;G.statementCorrect=(shown===String(q.answer));G.feedback="";
}
function gamePlay(){
 if(!G)return gameHome();
 if(G.ended)return gameResult();
 if(G.mode==="match")return gameMatchScreen();
 var q=G.mode==="tf"?G.current:G.all[G.idx%G.all.length];
 var title=G.mode==="speed"?"⏱️ Thử thách 60 giây":G.mode==="tf"?"🟢 Đúng hay sai?":"🧰 Mở rương kho báu";
 var prompt=G.mode==="tf"?(q.prompt+"<div class='note'>Nhận định: <b>"+esc(G.statement)+"</b></div>"):q.prompt;
 var h='<button class="ghost" onclick="go({p:\'games\'})">← Chọn trò chơi</button><div class="card"><div class="row"><h2>'+title+'</h2><span class="pill">⭐ '+G.score+' điểm</span></div>';
 if(G.mode==="speed")h+='<div class="note">⏳ Còn <b id="gameClock">'+G.seconds+'</b> giây · Câu đã trả lời: '+G.answered+'</div>';
 if(G.mode==="treasure")h+='<div class="note">'+(G.chest[G.idx%G.chest.length]||"🎁 Rương kho báu")+' · Câu '+(G.idx+1)+'/'+G.all.length+'</div>';
 if(G.mode==="tf")h+='<div class="note">Câu '+(G.idx+1)+' · Hãy đọc kỹ nhận định rồi chọn đáp án.</div>';
 h+='<h3>'+prompt+'</h3>';
 if(G.mode==="tf")h+='<button class="big" onclick="answerTF(true)">✅ Đúng</button><button class="big" onclick="answerTF(false)">❌ Sai</button>';
 else{
  var opts=gameOptions(q);
  h+='<div class="grid">'+opts.map(function(o,i){return '<button class="opt" onclick="answerMini('+JSON.stringify(o).replace(/"/g,"&quot;")+')">'+esc(o)+'</button>';}).join("")+'</div>';
 }
 h+='<div class="fb">'+(G.feedback||"")+'</div>';
 if(G.mode!=="speed")h+='<button class="ghost" onclick="skipMini()">Bỏ qua câu này</button>';
 h+='<button class="ghost" onclick="finishMini()">Kết thúc lượt chơi</button></div>';
 A.innerHTML=h;
}
function answerMini(value){
 if(!G||G.ended)return;
 var q=G.all[G.idx%G.all.length];
 G.answered++;
 if(String(value)===String(q.answer)){G.score+=10;G.feedback="🎉 Chính xác! +10 điểm. "+(G.mode==="treasure"?"Bạn tìm thấy kho báu!":"");}
 else G.feedback="💡 Đáp án đúng là: "+String(q.answer)+". "+(q.lesson?"Hãy ôn lại bài "+q.lesson+".":"");
 if(G.mode==="speed"){G.idx++;G.feedback="";if(G.seconds>0)gamePlay();}
 else if(G.mode==="treasure"){gamePlayWithFeedback();}
 else gamePlayWithFeedback();
}
function gamePlayWithFeedback(){
 var old=G.feedback;
 gamePlay();
 var fb=A.querySelector(".fb");if(fb)fb.textContent=old;
 var allButtons=A.querySelectorAll("button");allButtons.forEach(function(b){b.disabled=true;});
 var card=A.querySelector(".card");if(card){var n=document.createElement("button");n.className="big";n.textContent="Câu tiếp theo ➜";n.onclick=function(){G.idx++;if(G.idx>=G.all.length){G.ended=true;}else if(G.mode==="tf")prepareTF();G.feedback="";gamePlay();};card.appendChild(n);}
}
function answerTF(chosen){
 if(!G||G.ended)return;
 G.answered++;
 if(chosen===G.statementCorrect)G.score+=10;
 G.feedback=chosen===G.statementCorrect?"🎉 Chính xác! +10 điểm.":"💡 Chưa đúng. Đáp án là "+(G.statementCorrect?"Đúng":"Sai")+".";
 gamePlayWithFeedback();
}
function skipMini(){
 if(!G)return;
 G.idx++;
 if(G.idx>=G.all.length){G.ended=true;}else if(G.mode==="tf")prepareTF();
 G.feedback="";gamePlay();
}
function pickPair(side,id){
 if(!G||G.ended)return;
 var p=G.pairs.filter(function(x){return x.i===id;})[0];if(!p||p.done)return;
 if(side===0){
  G.pickQ=id;
  if(G.pickA!==null)checkPair();
 }else{
  G.pickA=id;
  if(G.pickQ!==null)checkPair();
 }
 gamePlay();
}
function checkPair(){
 if(G.pickQ===G.pickA){
  var p=G.pairs.filter(function(x){return x.i===G.pickQ;})[0];p.done=true;G.score+=10;G.answered++;
  G.feedback="✨ Ghép đúng! +10 điểm.";
 }else{G.tries++;G.feedback="Chưa khớp, thử lại nhé!";}
 G.pickQ=null;G.pickA=null;
 if(G.pairs.every(function(x){return x.done;}))G.ended=true;
}
function gameMatchScreen(){
 if(G.ended)return gameResult();
 var left=G.qSide.map(function(id){var p=G.pairs.filter(function(x){return x.i===id;})[0];return '<button class="opt" '+(p.done?'disabled':'')+' style="'+(G.pickQ===id?'outline:4px solid #ffb703;':'')+'" onclick="pickPair(0,'+id+')">'+esc(p.prompt)+'</button>';}).join("");
 var right=G.aSide.map(function(id){var p=G.pairs.filter(function(x){return x.i===id;})[0];return '<button class="opt" '+(p.done?'disabled':'')+' style="'+(G.pickA===id?'outline:4px solid #ffb703;':'')+'" onclick="pickPair(1,'+id+')">'+esc(p.answer)+'</button>';}).join("");
 A.innerHTML='<button class="ghost" onclick="go({p:\'games\'})">← Chọn trò chơi</button><div class="card"><div class="row"><h2>🧩 Ghép đôi thần tốc</h2><span class="pill">⭐ '+G.score+' điểm</span></div><p>Chọn một câu hỏi bên trái, rồi chọn đáp án tương ứng bên phải.</p><div class="grid"><div>'+left+'</div><div>'+right+'</div></div><div class="fb">'+(G.feedback||"Ghép đúng mỗi cặp được 10 điểm.")+'</div><button class="ghost" onclick="finishMini()">Kết thúc lượt chơi</button></div>';
}
function finishMini(){
 if(!G)return;
 if(G.timerId){clearInterval(G.timerId);G.timerId=null;}
 G.ended=true;gamePlay();
}
function gameResult(){
 if(G.timerId){clearInterval(G.timerId);G.timerId=null;}
 var max=G.mode==="match"?G.pairs.length*10:G.answered*10;
 A.innerHTML='<div class="card" style="text-align:center;background:linear-gradient(135deg,#fff1a8,#d8f8e1)"><div style="font-size:64px">🏆</div><h2>Hoàn thành trò chơi!</h2><div class="big-star">⭐ '+G.score+'</div><p>Bạn đã trả lời <b>'+G.answered+'</b> câu. '+(G.score>=50?"Tuyệt vời! Bạn là nhà vô địch nhí!":"Cố gắng thêm nhé, mỗi lượt chơi giúp con tiến bộ hơn!")+'</p><button class="big" onclick="startMini(\''+G.mode+'\')">🔁 Chơi lại</button><button class="big" onclick="go({p:\'games\'})">🎮 Chọn trò khác</button><button class="ghost" onclick="go({p:\'home\'})">🏠 Trang chủ</button></div>';
}
</script>
</body></html>
